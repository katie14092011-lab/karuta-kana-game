<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karuta Kana Game - Learn Japanese</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #f4f6f0; font-family: sans-serif; }
    .card-matcha { background: #e8efe0; border: 2px solid #a3b899; }
    .btn-matcha { background-color: #4a6b46; color: white; }
    .btn-matcha:hover { background-color: #3b5738; }
  </style>
</head>
<body class="flex items-center justify-content-center min-h-screen p-4">

  <div id="game-card" class="bg-white rounded-3xl shadow-xl border border-gray-200 w-full max-full p-6 text-center relative max-w-md">
    <button onclick="nextQuestion()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold">✕</button>

    <!-- Đã sửa: Chỉ hiển thị tên danh mục chung, KHÔNG hiện đáp án -->
    <div id="quiz-category" class="text-xs font-bold tracking-widest text-emerald-700 uppercase mb-4">
      CHỦ ĐỀ: HIRAGANA & KATAKANA
    </div>

    <!-- Hiển thị chữ Kana / Kanji -->
    <div class="card-matcha rounded-2xl p-8 mb-6 shadow-inner flex items-center justify-center min-h-[140px]">
      <div id="kana-display" class="text-6xl font-extrabold text-emerald-950">
        ごじょう
      </div>
    </div>

    <!-- Các nút chức năng -->
    <div class="flex justify-center gap-3 mb-6">
      <button onclick="playAudio()" class="flex items-center gap-1.5 px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-full font-medium text-sm transition">
        🔊 Nghe
      </button>
      <button onclick="showHint()" class="flex items-center gap-1.5 px-4 py-2 bg-amber-50 hover:bg-amber-100 text-amber-700 rounded-full font-medium text-sm transition border border-amber-200">
        💡 Gợi ý
      </button>
    </div>

    <!-- Ô nhập câu trả lời -->
    <div id="input-container" class="space-y-4">
      <input type="text" id="romaji-input" placeholder="Nhập Romaji..." class="w-full px-4 py-3 rounded-xl border-2 border-emerald-800 text-center text-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" onkeypress="handleKeyPress(event)">
      
      <button onclick="checkAnswer()" class="w-full py-3 btn-matcha rounded-xl font-bold text-lg shadow-md transition">
        Xác Nhận ➔
      </button>
    </div>

    <!-- Khung thông báo kết quả (Chỉ hiện khi bấm Xác nhận) -->
    <div id="result-box" class="hidden mt-4 p-4 rounded-xl text-left border">
      <div id="result-status" class="font-bold mb-1"></div>
      <div id="result-detail" class="text-sm text-gray-700 mb-3"></div>
      <button onclick="nextQuestion()" class="w-full py-2.5 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-lg transition">
        Chuyển qua câu mới ➔
      </button>
    </div>
  </div>

  <script>
    // Danh sách câu hỏi (Tự động hỗ trợ cả "gojo" lẫn "gojou")
    const questions = [
      {
        category: "KATAKANA",
        display: "モ",
        answers: ["mo"],
        hint: "Chữ 'mo' trong bảng Katakana",
        detail: "Katakana: モ (mo)"
      },
      {
        category: "ANIME / NHÂN VẬT",
        display: "ごじょう",
        answers: ["gojo", "gojou"], // Đã hỗ trợ cả 2 cách gõ!
        hint: "Thầy giáo trong Jujutsu Kaisen",
        detail: "Nhân vật: Thầy Gojo Satoru (ごじょう / Gojou)"
      },
      {
        category: "HIRAGANA",
        display: "とうきょう",
        answers: ["tokyo", "toukyou", "tokyou"],
        hint: "Thủ đô của Nhật Bản",
        detail: "Từ vựng: Tokyo (とうきょう)"
      }
    ];

    let currentIndex = 0;

    function loadQuestion() {
      const q = questions[currentIndex];
      document.getElementById('quiz-category').innerText = `CHỦ ĐỀ: ${q.category}`;
      document.getElementById('kana-display').innerText = q.display;
      document.getElementById('romaji-input').value = '';
      document.getElementById('input-container').classList.remove('hidden');
      document.getElementById('result-box').classList.add('hidden');
      document.getElementById('romaji-input').focus();
    }

    function checkAnswer() {
      const input = document.getElementById('romaji-input').value.trim().toLowerCase();
      const q = questions[currentIndex];
      
      if (!input) return;

      // Chuẩn hóa loại bỏ bớt 'u' trong 'ou' để so sánh linh hoạt
      const cleanInput = input.replace(/ou/g, 'o');
      const isCorrect = q.answers.some(ans => ans === input || ans.replace(/ou/g, 'o') === cleanInput);

      const resultBox = document.getElementById('result-box');
      const resultStatus = document.getElementById('result-status');
      const resultDetail = document.getElementById('result-detail');

      document.getElementById('input-container').classList.add('hidden');
      resultBox.classList.remove('hidden');

      if (isCorrect) {
        resultBox.className = "mt-4 p-4 rounded-xl text-left border bg-emerald-50 border-emerald-200 text-emerald-800";
        resultStatus.innerText = "🎉 Chính xác! Bạn giỏi quá!";
        resultDetail.innerText = `${q.detail}`;
      } else {
        resultBox.className = "mt-4 p-4 rounded-xl text-left border bg-rose-50 border-rose-200 text-rose-800";
        resultStatus.innerText = "❌ Rất tiếc, bạn đã trả lời chưa chính xác!";
        resultDetail.innerText = `Đáp án đúng là: ${q.answers[0].toUpperCase()} (${q.detail})`;
      }
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') checkAnswer();
    }

    function nextQuestion() {
      currentIndex = (currentIndex + 1) % questions.length;
      loadQuestion();
    }

    function showHint() {
      alert("💡 Gợi ý: " + questions[currentIndex].hint);
    }

    function playAudio() {
      const text = questions[currentIndex].display;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ja-JP';
      speechSynthesis.speak(utterance);
    }

    // Chạy câu đầu tiên khi mở trang
    loadQuestion();
  </script>
</body>
</html>
